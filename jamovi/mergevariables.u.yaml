title: Merge Variables
name: mergevariables
jus: '3.0'
stage: 0
compilerMode: aggressive
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables to Merge
        children:
          - type: VariablesListBox
            name: variables
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: targetName
        format: string
  - type: LayoutBox
    margin: large
    children:
      - type: ActionButton
        name: runTrigger
      - type: Output
        name: newColumn
