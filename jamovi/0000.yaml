description: >-
  Performs multiple encoding on variables containing delimited values. Each
  unique value becomes a binary (0/1) column. Improvements over OneHotEncoding:
  - Only trims whitespace after splitting (preserves internal spaces) - Uses a
  single vectorized strsplit for better performance - Variable description
  contains only the unique value - Includes a Run button; execution happens only
  when clicked
